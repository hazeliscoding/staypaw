name: winget

# Runs when a stable release is published (prereleases don't fire "released"): Komac adds the version to winget-pkgs
# through a pull request from the owner's fork, so `winget install` gets the newest version. The first version, 1.0.0,
# went in by hand (winget-pkgs #461348), since Komac can only update a package winget already has. Releases published
# before that merges fail here; a run by hand with the newest tag catches winget up. WINGET_TOKEN is a classic token
# with public_repo; until it exists, this does nothing.
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: The published release's tag, such as v1.2.1
        required: true

permissions:
  contents: read

jobs:
  submit:
    name: Submit to winget
    runs-on: ubuntu-latest
    env:
      KOMAC_VERSION: 2.16.0
      KOMAC_SHA256: 7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
    steps:
      - name: Submit the release
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN isn't set, so nothing went to winget."
            exit 0
          fi
          archive="komac-$KOMAC_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/russellbanks/Komac/releases/download/v$KOMAC_VERSION/$archive"
          echo "$KOMAC_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" komac
          ./komac update hazeliscoding.Staypaw --version "${TAG#v}" \
            --urls "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/staypaw-setup-win-x64.exe" --submit
