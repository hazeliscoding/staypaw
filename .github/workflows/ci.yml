name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secret scan reads the whole history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Staypaw.slnx

      - name: Build
        run: dotnet build Staypaw.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Staypaw.slnx --configuration Release --no-build

      - name: Format
        run: dotnet format Staypaw.slnx --verify-no-changes --no-restore

      # Trim and AOT warnings only appear at publish, so they fail the build here.
      - name: Publish
        run: dotnet publish src/Staypaw.Desktop --configuration Release --runtime win-x64 -warnaserror

      # gitleaks is pinned and checked against its release checksum. --full-history HEAD scans this branch's
      # history only; by default it scans every ref, so one branch's leak would fail every run.
      - name: Secret scan
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw "gitleaks checksum mismatch: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\gitleaks"
          & "$env:RUNNER_TEMP\gitleaks\gitleaks.exe" git --log-opts="--full-history HEAD" --redact --no-banner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
